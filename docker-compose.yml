version: '3.8'

services:
  python-ai-service:
    build:
      context: ./python-ai-service
      dockerfile: Dockerfile
    container_name: python_ai_microservice
    restart: always
    ports:
      - "8001:8001"

  java-backend:
    build:
      context: ./java-backend
      dockerfile: Dockerfile
    container_name: java_backend_service
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - python-ai-service

  web-frontend:
    image: nginx:alpine
    container_name: web_frontend
    restart: always
    volumes:
      - ./web-frontend:/usr/share/nginx/html
    ports:
      - "5173:80"
    depends_on:
      - java-backend
