<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Gap Analysis - AI Resume Analyzer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <div>
        <h1 style="font-size: 2rem; font-weight: 800;">Skill Gap Analysis</h1>
        <p style="color: #64748b; font-size: 0.9rem;">Compare candidate technical profile against target roles</p>
      </div>
      <div>
        <select id="role-select" onchange="loadSkillGap()" style="padding: 0.6rem 1rem; border-radius: 8px; border: 1px solid #cbd5e1; font-weight: 600; font-size: 0.9rem;">
          <option value="Full Stack Developer">Full Stack Developer</option>
          <option value="Java Developer">Java Developer</option>
          <option value="Python Developer">Python Developer</option>
          <option value="Frontend Developer">Frontend Developer</option>
          <option value="Backend Developer">Backend Developer</option>
          <option value="Data Scientist">Data Scientist</option>
          <option value="DevOps Engineer">DevOps Engineer</option>
        </select>
      </div>
    </div>

    <div class="grid-4">
      <div class="metric-card">
        <div class="metric-icon" style="background: #dcfce7; color: #15803d;">✅</div>
        <div>
          <div class="metric-lbl">Already Learned</div>
          <div class="metric-val" id="learned-pct">50%</div>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon" style="background: #fef3c7; color: #b45309;">~</div>
        <div>
          <div class="metric-lbl">Partially Covered</div>
          <div class="metric-val" id="partial-pct">25%</div>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon" style="background: #fee2e2; color: #b91c1c;">+</div>
        <div>
          <div class="metric-lbl">Missing Skills</div>
          <div class="metric-val" id="missing-pct">25%</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3 class="card-title">Skill Comparison Breakdown</h3>
      <div style="margin-bottom: 1rem;">
        <strong style="font-size: 0.85rem; color: #15803d;">Already Learned:</strong>
        <div id="learned-list" style="margin-top: 0.4rem;"></div>
      </div>
      <div style="margin-bottom: 1rem;">
        <strong style="font-size: 0.85rem; color: #b45309;">Partially Covered:</strong>
        <div id="partial-list" style="margin-top: 0.4rem;"></div>
      </div>
      <div>
        <strong style="font-size: 0.85rem; color: #b91c1c;">Missing Skills:</strong>
        <div id="missing-list" style="margin-top: 0.4rem;"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 AI Resume Analyzer & Job Matcher. Python, Java, JS, HTML & CSS.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    checkAuthProtection();
    document.addEventListener('DOMContentLoaded', loadSkillGap);

    async function loadSkillGap() {
      const role = document.getElementById('role-select').value;
      try {
        const data = await apiRequest(`/skill-gap?target_role=${encodeURIComponent(role)}`);
        document.getElementById('learned-pct').textContent = `${data.stats.learned_percentage}%`;
        document.getElementById('partial-pct').textContent = `${data.stats.partial_percentage}%`;
        document.getElementById('missing-pct').textContent = `${data.stats.missing_percentage}%`;

        document.getElementById('learned-list').innerHTML = data.already_learned.map(s => `<span class="tag-badge tag-success">${s}</span>`).join('') || '<span style="font-size: 0.8rem; color: #94a3b8;">None</span>';
        document.getElementById('partial-list').innerHTML = data.partially_covered.map(s => `<span class="tag-badge tag-warning">${s}</span>`).join('') || '<span style="font-size: 0.8rem; color: #94a3b8;">None</span>';
        document.getElementById('missing-list').innerHTML = data.missing.map(s => `<span class="tag-badge tag-danger">${s}</span>`).join('') || '<span style="font-size: 0.8rem; color: #94a3b8;">None</span>';
      } catch (e) {
        console.error("Skill gap load error", e);
      }
    }
  </script>
</body>
</html>
