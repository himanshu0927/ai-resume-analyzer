<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Analyzer - AI Resume Analyzer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container" style="max-width: 800px;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h1 style="font-size: 2rem; font-weight: 800;">Resume Analyzer</h1>
      <p style="color: #64748b; font-size: 0.95rem; margin-top: 0.5rem;">Upload your PDF or Word resume to extract skills, compute scores, and get actionable suggestions.</p>
    </div>

    <div id="error-alert" style="display: none; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #b91c1c; padding: 1rem; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1.5rem;"></div>

    <div class="card" style="padding: 3rem 2rem; text-align: center;">
      <form id="upload-form">
        <div id="drop-zone" style="border: 2px dashed #cbd5e1; border-radius: 12px; padding: 3rem 1.5rem; background: #f8fafc; cursor: pointer; transition: all 0.2s;" onclick="document.getElementById('file-input').click()">
          <input type="file" id="file-input" accept=".pdf,.docx,.doc" style="display: none;">
          <div style="font-size: 3rem; margin-bottom: 1rem;">📤</div>
          <h3 style="font-size: 1.1rem; font-weight: 700; color: #1e293b; margin-bottom: 0.5rem;" id="drop-zone-text">Click or Drag & Drop Resume File</h3>
          <p style="font-size: 0.8rem; color: #94a3b8;">Supports PDF (.pdf) or Word (.docx) up to 10MB</p>
        </div>

        <button type="submit" id="upload-btn" class="btn-btn btn-primary" style="width: 100%; justify-content: center; padding: 0.9rem; font-size: 1rem; margin-top: 1.5rem;" disabled>
          Start Resume Analysis
        </button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 AI Resume Analyzer & Job Matcher. Python, Java, JS, HTML & CSS.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    checkAuthProtection();

    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');
    const dropZoneText = document.getElementById('drop-zone-text');
    const uploadBtn = document.getElementById('upload-btn');
    const errAlert = document.getElementById('error-alert');

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        const file = e.target.files[0];
        dropZoneText.innerHTML = `Selected File: <span style="color: #2563eb;">${file.name}</span>`;
        uploadBtn.disabled = false;
      }
    });

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!fileInput.files[0]) return;

      errAlert.style.display = 'none';
      uploadBtn.disabled = true;
      uploadBtn.textContent = 'Extracting Text & Analyzing Skills...';

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      try {
        const res = await apiRequest('/resumes/upload', 'POST', formData, true);
        window.location.href = `result.html?id=${res.id}`;
      } catch (err) {
        errAlert.textContent = err.message || 'Failed to analyze resume document.';
        errAlert.style.display = 'block';
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Start Resume Analysis';
      }
    });
  </script>
</body>
</html>
